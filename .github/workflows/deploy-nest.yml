name: Deploy NestJS Project
on:
  push:
    branches:
      - feat/NinedevNestJs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 103.161.16.77
          username: root
          port: 26266
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            TARGET_DIR="/var/www/nest-tutorial-app"
            rm -rf $TARGET_DIR
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR

            # 1. Clone code kèm submodule
            git clone --recursive -b feat/NinedevNestJs https://github.com/Trhgam/self-taught-NestJs-be.git .

            # 2. Tìm vị trí file docker-compose.yml
            COMPOSE_PATH=$(find . -name "docker-compose.yml" -printf '%h' -quit)

            if [ -n "$COMPOSE_PATH" ]; then
              echo "Found docker-compose in: $COMPOSE_PATH"
              cd "$COMPOSE_PATH"
              
              # 3. Tạo file .env ảo để tránh lỗi Docker không tìm thấy file
              if [ ! -f .env ]; then
                touch .env
                echo "PORT=3001" >> .env
              fi

              # 4. Chạy Docker (Sử dụng Docker V2 chuẩn server bạn)
              docker compose down || true
              docker compose up -d --build
            else
              echo "LỖI: Không tìm thấy file docker-compose.yml!"
              exit 1
            fi
