name: Deploy NestJS Project
on:
  push:
    branches:
      - feat/NinedevNestJs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 103.161.16.77
          username: root
          port: 26266
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Dọn dẹp dứt điểm: Xóa thư mục cũ nếu có để tránh lỗi Git kẹt
            rm -rf /var/www/nest-tutorial-app
            mkdir -p /var/www/nest-tutorial-app
            cd /var/www/nest-tutorial-app

            # 2. Clone mới hoàn toàn (Cách này bỏ qua mọi lỗi safe directory hay xung đột file)
            git clone -b feat/NinedevNestJs https://github.com/Trhgam/self-taught-NestJs-be.git .

            # 3. Vào folder và chạy Docker
            cd nest-tutorial
            docker compose up -d --build
