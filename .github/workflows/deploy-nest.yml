name: Deploy NestJS Project
on:
  push:
    branches: [feat/NinedevNestJs] # Kích hoạt khi push vào nhánh này
    paths:
      - "nest-tutorial/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 103.161.16.77
          username: root
          port: 26266
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Tạo thư mục nếu chưa có và đi vào
            mkdir -p /var/www/nest-tutorial-app
            cd /var/www/nest-tutorial-app

            # 2. Nếu chưa có git thì clone, có rồi thì pull đúng nhánh feat
            if [ ! -d ".git" ]; then
              git clone -b feat/NinedevNestJs https://github.com/Trhgam/self-taught-NestJs-be.git .
            else
              git checkout feat/NinedevNestJs
              git pull origin feat/NinedevNestJs
            fi

            # 3. Vào thư mục chứa code Nest và chạy Docker
            cd nest-tutorial
            docker compose up -d --build
