name: Deploy NestJS Project
on:
  push:
    branches: [feat/NinedevNestJs]
    paths:
      - "nest-tutorial/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 103.161.16.77
          username: root
          port: 26266
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Tạo và vào thư mục dự án Nest
            mkdir -p /var/www/nest-tutorial-app
            cd /var/www/nest-tutorial-app

            # Kiểm tra và kéo code đúng nhánh
            if [ ! -d ".git" ]; then
              git clone -b feat/NinedevNestJs https://github.com/Trhgam/self-taught-NestJs-be.git .
            else
              git fetch origin feat/NinedevNestJs
              git checkout feat/NinedevNestJs
              git pull origin feat/NinedevNestJs
            fi

            # Vào folder chứa code và restart Docker
            cd nest-tutorial
            docker compose up -d --build
